<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Ksenia's Fruit Friends</title>
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <div id="ui">
      <div class="title">Ksenia's Fruit Friends</div>
      <div class="stats">
        <div>Score: <span id="score">0</span></div>
        <div>Food bag: <span id="bag">0</span></div>
        <div>Friends: <span id="friends">0</span></div>
      </div>
      <div class="hint">WASD to walk, mouse to look. Walk into produce to collect. Press F near an animal to feed it. Animals you feed will follow you in a line.</div>
    </div>

    <script type="module" src="./main.js"></script>
  </body>
</html>
